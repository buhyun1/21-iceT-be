image:
  repository: 266735804784.dkr.ecr.ap-northeast-2.amazonaws.com/dev-k8s
  tag: latest

env:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  KAKAO_ADMIN_KEY: ""
  KAKAO_CLIENT_ID: ""
  KAKAO_CLIENT_SECRET: ""
  KAKAO_REDIRECT_URI: ""
  AWS_S3_ACCESS_KEY: ""
  AWS_S3_SECRET_KEY: ""
  AWS_REGION_STATIC: ""
  JWT_SECRET: ""
  CLOUD_AWS_S3_BUCKET: ""

service:
  type: ClusterIP
  port: 8080

redis:
  image: redis:7
  port: 6379

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/group.name: kooco-api
  hosts:
    - host: www.kooco.click
      paths:
        - path: /api/*
          pathType: Prefix
        - path: /actuator/*
          pathType: Prefix
