apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullname" . }}
  namespace: ingress-nginx
spec:
  type: {{ .Values.controller.service.type }}
  selector:
    app: nginx-ingress
  ports:
    - name: http
      port: {{ .Values.controller.service.port }}
      targetPort: 80
      nodePort: {{ .Values.controller.service.nodePort }} 