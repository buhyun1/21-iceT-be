apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: www.kooco.click
      http:
        paths:
        - path: /api/?(.*)
          pathType: Prefix
          backend:
            service:
              name: spring-svc1
              port:
                number: 8080
        - path: /health/*
          pathType: Prefix
          backend:
            service:
              name: spring-svc2
              port:
                number: 80
