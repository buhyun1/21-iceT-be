apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-dev-k8s-dev-ingress
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: www.kooco.click
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /healthz
            pathType: ImplementationSpecific
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
    - host: kooco.click
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /healthz
            pathType: ImplementationSpecific
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-dev-k8s-dev
                port:
                  number: 80

