apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-ingress
  namespace: dev
  annotations:
    # IngressClass 지정
    kubernetes.io/ingress.class: alb
    # 기존 ALB 채택: 미리 생성된 ALB ARN
    alb.ingress.kubernetes.io/load-balancer-arn: arn:aws:elasticloadbalancing:ap-northeast-2:266735804784:loadbalancer/app/kube-cluster-alb/05db535c135d7c72
    # 공인용 ALB
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pod IP 직접 라우팅 (CNI 필요) 또는 instance
    alb.ingress.kubernetes.io/target-type: instance
    # HTTPS 리스너(443)만 생성
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # 백엔드 프로토콜
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # ACM 인증서 ARN (HTTPS 종단)
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:266735804784:certificate/ff1a29dd-074f-4a89-aa9c-fbc951b86e13
    # HTTP → HTTPS 리다이렉트
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - www.kooco.click
      secretName: tls-secret  # Cert-Manager 등으로 생성된 Kubernetes TLS Secret
  rules:
    - host: www.kooco.click
      http:
        paths:
          - path: /actuator/*
            pathType: Prefix
            backend:
              service:
                name: spring-svc
                port:
                  number: 80
          - path: /api/*
            pathType: Prefix
            backend:
              service:
                name: spring-svc
                port:
                  number: 80
