apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-dev.fullname" . }}
  labels:
    app: {{ include "k8s-dev.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "k8s-dev.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "k8s-dev.name" . }}
    spec:
      imagePullSecrets:
        - name: ecr-secret
      hostNetwork: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
