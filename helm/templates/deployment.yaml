apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:             
        - name: ecr-secret
      hostNetwork: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: SPRING_DATASOURCE_URL
              value: "{{ .Values.env.SPRING_DATASOURCE_URL }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.env.SPRING_DATASOURCE_USERNAME }}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{ .Values.env.SPRING_DATASOURCE_PASSWORD }}"
            - name: SPRING_REDIS_HOST
              value: "{{ .Values.env.SPRING_REDIS_HOST }}"
            - name: SPRING_REDIS_PORT
              value: "{{ .Values.env.SPRING_REDIS_PORT }}"
            - name: KAKAO_ADMIN_KEY
              value: "{{ .Values.env.KAKAO_ADMIN_KEY }}"
            - name: KAKAO_CLIENT_ID
              value: "{{ .Values.env.KAKAO_CLIENT_ID }}"
            - name: KAKAO_CLIENT_SECRET
              value: "{{ .Values.env.KAKAO_CLIENT_SECRET }}"
            - name: KAKAO_REDIRECT_URI
              value: "{{ .Values.env.KAKAO_REDIRECT_URI }}"
            - name: AWS_S3_ACCESS_KEY
              value: "{{ .Values.env.AWS_S3_ACCESS_KEY }}"
            - name: AWS_S3_SECRET_KEY
              value: "{{ .Values.env.AWS_S3_SECRET_KEY }}"
            - name: AWS_REGION_STATIC
              value: "{{ .Values.env.AWS_REGION_STATIC }}"
            - name: JWT_SECRET
              value: "{{ .Values.env.JWT_SECRET }}"
            - name: CLOUD_AWS_S3_BUCKET
              value: "{{ .Values.env.CLOUD_AWS_S3_BUCKET }}"
