apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-dev.fullname" . }}
  labels:
    app: {{ include "k8s-dev.name" . }}
spec:
  selector:
    app: {{ include "k8s-dev.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
  type: {{ .Values.service.type }}
