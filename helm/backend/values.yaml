env:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  SPRING_REDIS_HOST: ""
  SPRING_REDIS_PORT: ""
  KAKAO_ADMIN_KEY: ""
  KAKAO_CLIENT_ID: ""
  KAKAO_CLIENT_SECRET: ""
  KAKAO_REDIRECT_URI: ""
  AWS_S3_ACCESS_KEY: ""
  AWS_S3_SECRET_KEY: ""
  AWS_REGION_STATIC: ""
  JWT_SECRET: ""
  CLOUD_AWS_S3_BUCKET: ""

image:
  repository: 266735804784.dkr.ecr.ap-northeast-2.amazonaws.com/dev-k8s
  tag: latest

env:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"

service:
  type: ClusterIP
  port: 8080

redis:
  image: redis:7
  port: 6379

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
  hosts:
    - host: www.kooco.click
      paths:
        - path: /api
          pathType: Prefix
        - path: /actuator/health
          pathType: Prefix
        - path: /healthz
          pathType: ImplementationSpecific
        - path: /
          pathType: Prefix
    - host: kooco.click
      paths:
        - path: /api
          pathType: Prefix
        - path: /actuator/health
          pathType: Prefix
        - path: /healthz
          pathType: ImplementationSpecific
        - path: /
          pathType: Prefix

controller:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443 
