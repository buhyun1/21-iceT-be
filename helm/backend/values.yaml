image:
  repository: 266735804784.dkr.ecr.ap-northeast-2.amazonaws.com/dev-k8s
  tag: latest

env:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  
service:
  type: ClusterIP
  port: 8080

redis:
  image: redis:7
  port: 6379

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: www.kooco.click
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /oauth/kakao/callback  
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /actuator/health
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /healthz
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
    - host: kooco.click
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /oauth/kakao/callback  
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /actuator/health
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080
        - path: /healthz
          pathType: Prefix
          backend:
            service:
              name: k8s-backend-backend
              port:
                number: 8080

controller:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443 
